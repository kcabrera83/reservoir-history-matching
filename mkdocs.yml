site_name: Reservoir History Matching
site_description: Assisted history matching with production data assimilation and forecasting.
repo_url: https://github.com/kcabrera83/reservoir-history-matching
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
